natural_language_models:
  - name: glm-5
    provider: z-ai
    api_key_env: GLM_API_KEY
    rpm_free_tier_limit: 99999
    rpd_free_tier_limit: 99999

embedding_models:
  - name: voyage-code-3
    provider: voyageai
    api_key_env: VOYAGE_API_KEY_1
    tokens_free_tier_limit: 200000000

eval_models:
  - name: voyage-code-3
    provider: voyageai
    #   api_key_env: VOYAGE_API_KEY_1
    tokens_free_tier_limit: 200000000

# Configuration
config:
  sufficiency_threshold: 0.8 # Configurable threshold for local-first answering
  hybrid_alpha: 0.2
  reranker_top_k_multiplier: 5
