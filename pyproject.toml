[project]
name = "knowcode"
version = "0.2.1"
description = "Efficient codebase knowledge graph builder"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "click>=8.1",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "pathspec>=0.11",
    "tree-sitter==0.21.3",
    "tree-sitter-languages>=1.10.0",
    "GitPython>=3.1.0",
    "tiktoken>=0.7.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "slowapi>=0.1.9",
]
search = [
    "faiss-cpu>=1.7.0",
    "lancedb>=0.12.0",
]
llm = [
    "openai>=1.0.0",
    "google-genai>=0.3.0",
    "google-api-core>=2.29.0",
]
watch = ["watchdog>=3.0.0"]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "slowapi>=0.1.9",
    "faiss-cpu>=1.7.0",
    "lancedb>=0.12.0",
    "openai>=1.0.0",
    "google-genai>=0.3.0",
    "google-api-core>=2.29.0",
    "watchdog>=3.0.0",
]
mcp = ["mcp>=1.0.0"]
voyageai = ["voyageai>=0.2.0"]

[project.scripts]
knowcode = "knowcode.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowcode"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.1.5",
    "mypy>=1.7",
    "types-pyyaml",
    "pytest-cov",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "eval: retrieval-quality evaluation tests",
]
