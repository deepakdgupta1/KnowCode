site_name: KnowCode Documentation
site_url: https://example.com/knowcode/
repo_url: https://github.com/deepakdgupta1/KnowCode
repo_name: deepakdgupta1/KnowCode
edit_uri: edit/main/docs/

# Superseded docs are kept for history but excluded from the built site.
exclude_docs: archive/*

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list

nav:
  - Home: index.md
  - User Guide:
      - Getting Started: user/getting-started.md
      - CLI Reference: user/cli-reference.md
      - Configuration: user/configuration.md
      - IDE & Agent Integration: user/ide-integration.md
      - REST API: user/rest-api.md
      - Telemetry & Privacy: user/telemetry.md
  - Product:
      - Overview: product/overview.md
      - Personas & Use-Cases: product/personas-use-cases.md
      - Business Logic: product/business-logic.md
  - Roadmap: roadmap.md
  - MCP Contract: mcp-contract.md
  - API Reference: api_reference.md
  - Architecture & Roadmap: architecture/reference_architecture.md
  - Storage Analysis ADR: architecture/json-storage-analysis.md
  - Hardening Contracts: architecture/hardening-contracts.md
  - Parser Construct Matrix: architecture/parser-construct-matrix.md
  - Workflow Diagrams: diagrams/README.md
  - Retrieval Quality Evals: retrieval-evals.md
  - Research:
      - Prose Evaluation: research/knowcode_evaluation_report.md
