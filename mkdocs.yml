site_name: KnowCode Documentation
site_url: https://example.com/knowcode/
repo_url: https://github.com/deepakdgupta1/KnowCode
repo_name: deepakdgupta1/KnowCode
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list

nav:
  - Home: index.md
  - Setup Guide: MCP_SETUP.md
  - MCP Contract: mcp-contract.md
  - API Reference: api_reference.md
  - Function Calling: OPENAPI_FUNCTION_CALLING.md
  - Architecture & Roadmap: architecture/reference_architecture.md
  - Storage Analysis ADR: architecture/json-storage-analysis.md
  - Workflow Diagrams: diagrams/README.md
  - Retrieval Quality Evals: retrieval-evals.md
  - Observability & Telemetry: observability.md
  - Research:
      - Prose Evaluation: research/knowcode_evaluation_report.md
